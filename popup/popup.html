<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
    <title>QMT Popup</title>
</head>

<body class="d-flex flex-column justify-content-center align-items-center">
    <div class="main-container">
        <div class="logo-container text-center">
            <img src="../assets/images/Header-QMT.png" alt="Logo-QMT" class="img-fluid">
        </div>

        <div id="initial-screen">
            <div class="content-section text-center">
                <label class="form-label label-login d-block">Inicia sesión para acceder a tus plantillas</label>
                <div class="d-grid">
                    <button class="btn btn-primary btn-login" type="button" id="btnSign-in">Iniciar Sesión</button>
                </div>
            </div>
            <div class="divider-container">
                <div class="divider-line"></div>
            </div>
            <div class="signup-section text-center">
                <label class="form-label label-signup d-block">¿Aún no tienes una cuenta?</label>
                <a class="link-signup" id="linkSign-up" style="cursor:pointer">Crea una cuenta gratis</a>
            </div>
        </div>

        <div id="login-form-screen" class="hidden">
            <form id="loginForm">
                <div class="form-group-login mb-3">
                    <label class="form-label-login">Correo electrónico</label>
                    <input type="email" class="form-control" id="emailInput" required>
                </div>
                <div class="form-group-login mb-3">
                    <label class="form-label-login">Contraseña</label>
                    <input type="password" class="form-control" id="passwordInput" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Iniciar sesión</button>
                <div class="text-center mt-3">
                    <a href="#" class="create-account-link small">Volver atrás</a>
                </div>
            </form>
        </div>

        <div id="session-screen" class="hidden text-center">
            <div class="user-info-box mb-3 p-3 border rounded bg-light">
                <img id="sessionAvatar" src="" class="rounded-circle mb-2" style="width: 48px;">
                <h6 id="sessionUserName" class="fw-bold mb-0">Cargando...</h6>
                <p id="sessionUserEmail" class="text-muted small"></p>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-primary py-2 fw-semibold" id="btnGoToDashboard">Ir al Dashboard</button>
                <button class="btn btn-link btn-sm text-danger text-decoration-none" id="btnPopupLogout">Cerrar
                    sesión</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
