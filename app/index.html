<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMailTemplates - Dashboard</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/editor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>


<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <img src="../assets/images/Logo-QMT.png" alt="QMT Logo" class="logo-icon">
                <span class="logo-text">QuickMailTemplates</span>
            </div>
        </div>

        <div class="header-center">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM18 18l-4-4" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <input type="text" class="search-input" placeholder="Buscar plantillas..." id="searchInput">
            </div>
        </div>

        <div class="header-right">
            <button class="btn-new-template" id="btnNewTemplate">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                Nueva plantilla
            </button>

            <button class="icon-btn" id="btnNotifications">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M15 6.5a5 5 0 0 0-10 0c0 5-2 6.5-2 6.5h14s-2-1.5-2-6.5zM11.5 16.5a1.5 1.5 0 0 1-3 0"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>

            <button class="icon-btn" id="btnTheme">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path
                        d="M10 1v2m0 14v2M3.93 3.93l1.41 1.41m9.9 9.9l1.41 1.41M1 10h2m14 0h2M4.34 15.66l1.41-1.41m9.9-9.9l1.41-1.41"
                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
            </button>

            <div class="user-profile" id="userProfile">
                <!-- Avatar: src se actualiza dinámicamente por app.js usando data-user-name -->
                <img src="https://ui-avatars.com/api/?name=U&background=475569&color=fff"
                     alt="User"
                     class="user-avatar"
                     id="userAvatar"
                     data-user-avatar>
                <span class="user-name" id="userDisplayName" data-user-name>—</span>
                <span class="user-email" data-user-email style="display:none"></span>
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>

            <div class="user-dropdown" id="userDropdown" style="display: none;">
                <a href="#profile" class="dropdown-item" data-view="profile">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="5" r="2.5" stroke="currentColor" stroke-width="1.5" />
                        <path d="M2.5 13a5.5 5.5 0 0 1 11 0" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" />
                    </svg>
                    Perfil
                </a>
                <a href="#settings" class="dropdown-item" data-view="settings">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <circle cx="8" cy="8" r="1.5" stroke="currentColor" stroke-width="1.5" />
                        <path
                            d="M13 8a5 5 0 0 0-.08-.8l1.3-1a.9.9 0 0 0 .2-1.2l-.9-1.5a.9.9 0 0 0-1.1-.4l-1.5.6a5 5 0 0 0-1.4-.8l-.4-1.6A.9.9 0 0 0 8.2 1h-1.8a.9.9 0 0 0-.9.7l-.4 1.6a5 5 0 0 0-1.4.8l-1.5-.6a.9.9 0 0 0-1.1.4l-.9 1.5a.9.9 0 0 0 .2 1.2l1.3 1A5 5 0 0 0 3 8a5 5 0 0 0 .08.8l-1.3 1a.9.9 0 0 0-.2 1.2l.9 1.5a.9.9 0 0 0 1.1.4l1.5-.6a5 5 0 0 0 1.4.8l.4 1.6a.9.9 0 0 0 .9.7h1.8a.9.9 0 0 0 .9-.7l.4-1.6a5 5 0 0 0 1.4-.8l1.5.6a.9.9 0 0 0 1.1-.4l.9-1.5a.9.9 0 0 0-.2-1.2l-1.3-1A5 5 0 0 0 13 8z"
                            stroke="currentColor" stroke-width="1.5" />
                    </svg>
                    Configuracion
                </a>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item" id="btnLogout">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M6 14H3a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h3M11 11l3-3-3-3M14 8H6" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Cerrar sesión
                </a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 class="sidebar-title">PLANTILLAS</h3>
                <nav class="sidebar-nav">
                    <a href="#my-templates" class="nav-item active" data-view="my-templates">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M15 6.5H3M15 11.5H3" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" />
                            <rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                        </svg>
                        Mis plantillas
                    </a>
                    <a href="#create-template" class="nav-item" data-view="create-template">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 4v10M4 9h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                            <rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
                        </svg>
                        Crear plantilla
                    </a>
                    <a href="#import" class="nav-item" data-view="import">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 12V4m0 0L6 7m3-3l3 3" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M15 11v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" />
                        </svg>
                        Importar plantilla
                    </a>
                    <a href="#export" class="nav-item" data-view="export">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 4v8m0 0l3-3m-3 3L6 9" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M15 11v4a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" />
                        </svg>
                        Exportar plantilla
                    </a>
                </nav>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">CONFIGURACIÓN</h3>
                <nav class="sidebar-nav">
                    <a href="#profile" class="nav-item" data-view="profile">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5" />
                            <path d="M3 15a6 6 0 0 1 12 0" stroke="currentColor" stroke-width="1.5"
                                stroke-linecap="round" />
                        </svg>
                        Perfil
                    </a>
                    <a href="#settings" class="nav-item" data-view="settings">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.5" />
                            <path
                                d="M14 9a5 5 0 0 0-.09-.9l1.4-1.1a1 1 0 0 0 .2-1.3l-1-1.7a1 1 0 0 0-1.2-.4l-1.6.6a5 5 0 0 0-1.6-.9l-.4-1.7a1 1 0 0 0-1-.8h-2a1 1 0 0 0-1 .8l-.4 1.7a5 5 0 0 0-1.6.9l-1.6-.6a1 1 0 0 0-1.2.4l-1 1.7a1 1 0 0 0 .2 1.3l1.4 1.1A5 5 0 0 0 4 9a5 5 0 0 0 .09.9l-1.4 1.1a1 1 0 0 0-.2 1.3l1 1.7a1 1 0 0 0 1.2.4l1.6-.6a5 5 0 0 0 1.6.9l.4 1.7a1 1 0 0 0 1 .8h2a1 1 0 0 0 1-.8l.4-1.7a5 5 0 0 0 1.6-.9l1.6.6a1 1 0 0 0 1.2-.4l1-1.7a1 1 0 0 0-.2-1.3l-1.4-1.1A5 5 0 0 0 14 9z"
                                stroke="currentColor" stroke-width="1.5" />
                        </svg>
                        Configuración
                    </a>
                    <a href="#admin-templates" class="nav-item admin-only" data-view="admin-templates">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M9 2l2 4h5l-4 3 1.5 5L9 11l-4.5 3L6 9 2 6h5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                        Administración
                    </a>
                </nav>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-header">
                    <h3 class="sidebar-title">ETIQUETAS</h3>
                </div>
                <!-- data-tags-nav: rellenado dinámicamente por updateTagsSidebar() en templates.js -->
                <nav class="sidebar-nav" data-tags-nav>
                    <span style="font-size:11px;color:var(--text-muted);padding:4px 8px;display:block">Sin etiquetas</span>
                </nav>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="content">
            <div id="view-container">
                <!-- Las vistas se cargarán dinámicamente aquí -->
            </div>
        </main>
    </div>

    <link rel="stylesheet" href="css/admin.css">
    <script src="js/views.js"></script>
    <script src="js/app.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/import.js"></script>
    <script src="js/export.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
