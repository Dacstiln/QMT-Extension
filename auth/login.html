<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Iniciar Sesión - QMT</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .logo {
            width: 120px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-4">
                <img src="../assets/images/Logo-QMT.png" alt="Logo-QMT" class="logo">
                <h4 class="mt-2">Inicia sesión en QMT</h4>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="emailInput" class="form-label fw-medium">Correo electrónico</label>
                    <input type="email" class="form-control" id="emailInput" placeholder="nombre@ejemplo.com" required>
                </div>
                <div class="mb-3">
                    <label for="passwordInput" class="form-label fw-medium">Contraseña</label>
                    <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Iniciar sesión</button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-0 small text-muted">¿No tienes cuenta? <a href="sign-up.html"
                        class="text-primary fw-semibold">Regístrate</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>
