<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <title>Registrarse - QMT</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .logo {
            width: 120px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
            <div class="text-center mb-3">
                <img src="../assets/images/Logo-QMT.png" alt="Logo-QMT" class="logo">
                <h4 class="mt-2">Crea tu cuenta en QMT</h4>
                <p class="mb-1 text-muted">¿Ya tienes cuenta? <a href="login.html"
                        class="text-primary fw-semibold">Inicia sesión</a></p>
            </div>
            <form id="signUpForm">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="InputName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="InputEmail" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="InputPassword" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrarse</button>
            </form>
        </div>
    </div>
    <script src="sign-up.js"></script>
</body>

</html>
